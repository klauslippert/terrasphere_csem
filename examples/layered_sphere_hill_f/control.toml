# Example layered_sphere_hill_f: conductive sphere below a Gaussian hill, layered earth, frequency domain.
#
# The same earth and sphere as in layered_sphere_t, now with a hill of height 30 m above the sphere.  The heights
# list gives three runs: H = 0 (flat ground, for the comparison), H = +30 m (hill) and H = -30 m (depression).
# The terrain effect and the interaction of the sphere with the topography are included (coupled series).
#
# Run (from the repository root):   python3 -m terrasphere_csem examples/layered_sphere_hill_f
# Results:                           examples/layered_sphere_hill_f/results/  (fields.npz, fields.csv, log.txt)
# All options of the control file are explained in examples/control_commented.toml.
# Units: SI.  x, y horizontal, z up, depths positive downwards.

name = "layered_sphere_hill_f"

[terrain]
# Gaussian hill  h(x, y) = H exp(-(x^2 + y^2) / (2 s^2)), centred at the origin.
width   = 150.0                  # s [m]
heights = [0.0, 30.0, -30.0]     # H [m]: 0 = flat, > 0 = hill, < 0 = depression.  One run per height.

[layers]
# The top layer carries the terrain: all interfaces must lie below the bottom of the depression.
depths       = [0.0, 200.0, 600.0]    # depths of the layer tops [m], measured from the flat ground
conductivity = [0.01, 0.005, 0.03]    # S/m, one value per layer

# Conductive sphere (10 Ohm m) in the middle layer, below the summit.
[sphere]
radius       = 80.0              # m
conductivity = 0.1               # S/m
mu_r         = 1.0               # relative permeability (1 = non-magnetic)
center       = [0.0, 0.0, 400.0] # x, y, depth [m] below the flat ground; on the hill axis for method "hankel"
degree       = 10                # highest multipole degree of the sphere response

# Grounded wire along the x axis, 500 m long, 1.5 km to the left of the hill, 1 A.  With terrain every source
# point must lie on the flat ground more than 1230 m from the summit (method "hankel", default window; outside the
# window of the expansion, see window_radius in control_commented.toml); the wire end at x = -1250 m satisfies this.
[[source]]
type    = "wire"
start   = [-1750.0, 0.0]
end     = [-1250.0, 0.0]
current = 1.0                    # A
gauss   = 96                     # Gauss points along the wire

[receivers]
profiles    = ["x", "y"]         # along the x axis (y = 0) and the y axis (x = 0), through the summit
half_length = 600.0              # m; with terrain below 680 m from the summit (method "hankel": where the window is 1)
spacing     = 20.0               # m

[frequencies]
list = [0.1, 10.0, 1000.0]       # Hz

[output]
formats = ["npz", "csv"]         # fields.npz and fields.csv: the flat field plus the terrain part per height

# Numerical settings are left at their defaults (method "hankel": Hankel transform, no periodic box).  A sphere
# off the hill axis needs  [numerics] method = "fft"  (periodic box with box correction, much slower).
