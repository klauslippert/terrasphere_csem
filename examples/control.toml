# Example control file: grounded wire in line with the x-profile, 500 m long, left of the hill; three layers
# (interfaces at 200 m and 600 m), no sphere.  Heights 0 / +30 / -30 m = flat model, hill, depression.
name = "T1_wire_inline"
[terrain]
width = 150.0
heights = [0.0, 30.0, -30.0]

[layers]
depths = [0.0, 200.0, 600.0]
conductivity = [0.01, 0.005, 0.03]

[receivers]
profiles = ["x", "y"]
half_length = 600.0
spacing = 20.0

[frequencies]
list = [0.1, 10.0, 1000.0]

[output]
formats = ["npz", "csv"]

[numerics]
method = "fft"
n = 512
dx = 10.0
orders = 20
lowpass = 0.2
box_correction = true
box_fmax = 100.0

[[source]]
type = "wire"
start = [-1750.0, 0.0]
end = [-1250.0, 0.0]
current = 1.0
gauss = 96
