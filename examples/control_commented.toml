# Example control file for terrasphere_csem, all options explained.
# Units: SI.  Horizontal positions (x, y) on the surface; z points up; depths are positive downwards.
# Run:  python3 -m terrasphere_csem <this file>   (results in results/ next to it).
# The file is checked before the computation (terrasphere_csem/checks.py); errors stop the run unless -f is given.

name = "example_hill_depression_sphere"  # label of the run (default: folder name)

# ---------------------------------------------------------------- terrain
[terrain]
# Gaussian hill/depression  h(x, y) = H * exp(-(x^2 + y^2) / (2 s^2)), centred at (0, 0).
width   = 150.0                          # s [m], horizontal width of the hill
heights = [0.0, 30.0, -30.0]             # H [m]: 0 = flat, > 0 = hill, < 0 = depression.  One run per height.

# ---------------------------------------------------------------- layered earth
[layers]
# The top layer carries the terrain: all interfaces must lie below the bottom of the depression.
depths       = [0.0, 100.0, 350.0]       # depths of the layer tops [m]; the first one is 0, the last layer is a half-space
conductivity = [0.01, 0.005, 0.03]       # S/m, one value per layer

# ---------------------------------------------------------------- sphere (optional)
[sphere]
# Omit the whole block for a run without sphere.
radius       = 60.0                      # [m]
conductivity = 1.0                       # S/m
mu_r         = 1.0                       # relative permeability (1 = non-magnetic)
center       = [0.0, 0.0, 220.0]         # x, y, depth [m]; with method = "hankel" it must lie on the hill axis (x = y = 0)
degree       = 10                        # highest multipole degree of the sphere response

# ---------------------------------------------------------------- sources (one or more blocks, fields are summed)
# With terrain (a height != 0) or a sphere every source point must lie on the flat ground off the hill and outside
# the window of the expansion (the field is singular at the source and must be cut off by the window).  With the
# default window: more than 1230 m from the summit for method "hankel" (radial grid up to window_radius +
# 8 window_width, plus 50 m) and at least 1084 m for "fft" (window_radius + 5.6 window_width).  For a loop this
# holds for its wire, so a loop may enclose the hill.  Flat models without sphere have no such limit.
[[source]]
type    = "wire"                         # wire | dipole | rectangle | polygon | circle
start   = [-1750.0, 0.0]                 # grounded wire from start to end [m]
end     = [-1250.0, 0.0]
current = 1.0                            # A
gauss   = 96                             # Gauss points along the wire

# [[source]]
# type      = "dipole"                   # grounded electric dipole
# center    = [-1500.0, 0.0]
# direction = 0.0                        # degrees from x towards y
# length    = 100.0                      # m
# current   = 1.0
# gauss     = 8                          # optional: finite wire of 8 Gauss points; omitted = point dipole of moment I L
#
# [[source]]
# type    = "rectangle"                  # rectangular loop
# corner1 = [-2000.0, -500.0]
# corner2 = [-1000.0,  500.0]
# current = 1.0
# gauss   = 24                           # Gauss points per side (default 24)
#
# [[source]]
# type    = "polygon"                    # closed polygonal loop
# corners = [[-2000.0, -500.0], [-1000.0, -500.0], [-1500.0, 500.0]]
# current = 1.0
# gauss   = 24                           # Gauss points per side (default 24)
#
# [[source]]
# type     = "circle"                    # circular loop
# center   = [-1500.0, 0.0]
# radius   = 300.0
# current  = 1.0
# segments = 256                         # area-preserving polygon with this many corners (default 256)
# gauss    = 3                           # Gauss points per polygon side (default 3)

# ---------------------------------------------------------------- receivers
[receivers]
profiles    = ["x", "y"]                 # x: along the x-axis (y = 0), y: along the y-axis (x = 0), both through the summit
half_length = 600.0                      # profiles run from -half_length to +half_length [m]; with terrain or a sphere
                                         #   below 680 m (hankel) / 698 m (fft) with the defaults, where the window is 1
spacing     = 20.0                       # receiver spacing [m]
# points    = [[200.0, 200.0], [-400.0, 200.0]]   # optional: receivers at arbitrary (x, y) [m]; z is set to the
                                         #   terrain height automatically.  Without `profiles` only the points are
                                         #   used (with it both, profiles first); label "p" in the outputs.  Same
                                         #   window limits as the profiles; method fft: x and y multiples of dx
                                         #   (and of box_dx when the box correction applies)

# ---------------------------------------------------------------- frequency OR time domain (give exactly one block)
[frequencies]
list = [0.1, 10.0, 1000.0]               # Hz

# [time]
# tmin   = 1e-5                          # s; the frequencies follow from the Sine/Cosine filter on a lagged time grid
# tmax   = 10.0                          # s
# signal = "off"                         # "off" = response to switch-off of the current, "on" = switch-on step

# ---------------------------------------------------------------- output
[output]
formats = ["npz", "csv"]                 # npz and/or csv; each file holds all field components
# Optionally add "coefficients" (e.g. formats = ["npz", "csv", "coefficients"]) for results/coefficients.npz:
# the series coefficients c_n of S(H) = sum_n c_n H^n per order, frequency and component (fft: on the whole
# x- and y-profile grid, plus the coarse runs of the box correction; hankel: at the receivers).  They do not
# depend on the height H: further heights, other profile points and the convergence per order can be evaluated
# from them without recomputing.  Not needed for the fields; large (about 13 MB per case with fft, n = 512).

# ---------------------------------------------------------------- numerics (all entries optional, defaults shown)
[numerics]
method = "hankel"                        # "hankel": Hankel transform per azimuthal order, no periodic box (default);
                                         #   sphere only on the hill axis
                                         # "fft": 2-D FFT on a periodic box with box correction; needed for a sphere
                                         #   off the hill axis
# both methods:
orders        = 20                       # number of orders of the height series
lowpass       = 0.2                      # smooth wavenumber cut-off exp[-(k/lowpass)^16] [rad/m]
window_radius = 860.0                    # radius [m] beyond which the reference field is tapered off (erfc window
                                         #   0.5 erfc((r - window_radius)/window_width)); chosen for width = 150 m
window_width  = 40.0                     # width of that taper [m].  The window sets the limits for sources
                                         #   and receivers when there is terrain or a sphere; see [[source]] and
                                         #   [receivers]
cpus          = 1                        # processes that compute the frequencies in parallel (each with
                                         #   cpu_count / cpus threads); 1 = one process.  Each process needs its own
                                         #   memory: about 10 GB with fft, n = 512 and a sphere of degree 12, much
                                         #   less without sphere; total about cpus x that
# hankel only:
m_max   = 40                             # highest azimuthal order
n_phi   = 128                            # azimuth points
npan_r  = 32                             # Gauss-Legendre panels in r
npan_l  = 32                             # Gauss-Legendre panels in the wavenumber
lam_max = 0.25                           # upper wavenumber limit [rad/m]
# fft only:
n  = 512                                 # grid points per side
dx = 10.0                                # grid spacing [m] (box n * dx = 5.12 km)
# box correction (fft only): coarse runs on three box sizes, Richardson extrapolation of the box error (~ L^-2)
box_correction = true                    # apply it
box_fmax       = 100.0                   # only up to this frequency [Hz]; in the time domain faded out towards it
box_dx         = 20.0                    # grid spacing of the coarse runs [m]
box_n          = [256, 512, 1024]        # grid points per side of the three coarse runs (boxes 5.12, 10.24, 20.48 km)
box_lowpass    = 0.12                    # low-pass of the coarse runs [rad/m] (below their Nyquist wavenumber)
box_orders     = 12                      # orders of the coarse runs
# time domain only ([time] block):
fmax_series = 2e6                        # the terrain series is computed only up to this frequency [Hz]
tolerance   = 1e-3                       # cut-off f_c: last frequency (from 1 Hz up) whose estimated truncation error
                                         #   stays below tolerance x the largest terrain effect; above f_c the terrain
                                         #   part is continued as a constant (f_c is written to the results)
