# elfe3D sphere comparison T3: square loop 400 x 400 m, centre (-1500, 0), counter-clockwise seen from above.
# Three layers (interfaces at 200 m and 600 m), conductive sphere 10 Ohm m, r = 180 m, centre 400 m deep in layer 2
# under the hill (height +90 m, width 150 m).  elfe3D: run with sphere (hill90) and same mesh without (hill90ref).
name = "T3_loop_offset"
[terrain]
width = 150.0
heights = [90.0]

[layers]
depths = [0.0, 200.0, 600.0]
conductivity = [0.01, 0.005, 0.03]

[receivers]
profiles = ["x", "y"]
half_length = 600.0
spacing = 20.0

[frequencies]
list = [0.1, 10.0, 1000.0]

[output]
formats = ["npz", "csv"]

[numerics]
method = "fft"
n = 512
dx = 10.0
orders = 20
lowpass = 0.2
box_correction = true
box_fmax = 100.0

[[source]]
type = "rectangle"
corner1 = [-1700.0, -200.0]
corner2 = [-1300.0, 200.0]
current = 1.0
gauss = 24

[sphere]
radius       = 180.0
conductivity = 0.1
mu_r         = 1.0
center       = [0.0, 0.0, 400.0]
degree       = 12
