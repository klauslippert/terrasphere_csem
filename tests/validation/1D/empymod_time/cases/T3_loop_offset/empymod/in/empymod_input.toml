[source]
depth = 1e-06                         # m below the surface
gauss = 40                           # each bipole as an explicit Gauss-Legendre sum of point dipoles
# finite bipoles [x0, x1, y0, y1] (m), current from (x0, y0) to (x1, y1); a loop = its sides
bipoles = [[-1700, -1300, -200, -200],
           [-1300, -1300, -200, 200],
           [-1300, -1700, 200, 200],
           [-1700, -1700, 200, -200]]
current = [1, 1, 1, 1]       # A, per bipole

[receivers]
depth = 1e-06                         # m below the surface
x = [-600, -300, 0, 300, 600, 0, 0, 0, 0, 0]
y = [0, 0, 0, 0, 0, -600, -300, 0, 300, 600]
profile = ["x", "x", "x", "x", "x", "y", "y", "y", "y", "y"]

[numerics]
ht = "dlf"
dlf = "key_201_2009"                  # Hankel: empymod default, standard
ft = "dlf"
ft_dlf = "key_601_2009"               # Fourier: standard, every time its own frequencies
ft_pts_per_dec = 0
