# empymod comparison in the time domain (flat model) T1: grounded wire in line with the x-profile, 500 m, centre 1500 m left of the hill.
# Three layers (interfaces at 200 m and 600 m), no sphere: the setup of ../../../../3D/elfe3d_topo/cases/T1_wire_inline.
# Flat model only (H = 0): the 1-D layered-earth field, compared with empymod; hills and valleys: see ../../../../3D/elfe3d_topo.
name = "T1_wire_inline"
[terrain]
width = 150.0
heights = [0.0]

[layers]
depths = [0.0, 200.0, 600.0]
conductivity = [0.01, 0.005, 0.03]

[receivers]
profiles = ["x", "y"]
half_length = 600.0
spacing = 300.0                # 5 stations per profile

[time]
tmin = 1e-5
tmax = 10.0
signal = "off"                 # switch-off of 1 A

[output]
formats = ["npz", "csv"]

[numerics]
method = "fft"
n = 512
dx = 10.0
orders = 20
lowpass = 0.2
box_correction = true
box_fmax = 100.0

[[source]]
type = "wire"
start = [-1750.0, 0.0]
end = [-1250.0, 0.0]
current = 1.0
gauss = 96
