# elfe3D comparison T2: grounded wire broadside (along y), 500 m, centre 1500 m left of the hill.
# Three layers (interfaces at 200 m and 600 m: thinner layers give > 2 million edges in the elfe3D mesh), no sphere.
# Heights 0 / +30 / -30 m = flat model, hill, valley (Gaussian, width 150 m, centre at the origin).
name = "T2_wire_broadside"
[terrain]
width = 150.0
heights = [0.0, 30.0, -30.0]

[layers]
depths = [0.0, 200.0, 600.0]
conductivity = [0.01, 0.005, 0.03]

[receivers]
profiles = ["x", "y"]
half_length = 600.0
spacing = 20.0

[frequencies]
list = [0.1, 10.0, 1000.0]

[output]
formats = ["npz", "csv"]

[numerics]
method = "fft"
n = 512
dx = 10.0
orders = 20
lowpass = 0.2
box_correction = true
box_fmax = 100.0

[[source]]
type = "wire"
start = [-1500.0, -250.0]
end = [-1500.0, 250.0]
current = 1.0
gauss = 96
