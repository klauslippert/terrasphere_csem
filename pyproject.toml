[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasphere_csem"
version = "1.2.0"
description = "Semi-analytic frequency- and time-domain EM responses of a conductive sphere in a layered earth and of Gaussian topography"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Klaus Lippert" }]
# tomllib (control files) needs Python >= 3.11; tested with Python 3.15.0 (numpy 2.5.4, scipy 1.18.1, the exact
# versions of requirements.txt) and Python 3.13.5 (numpy 2.4.3, scipy 1.17.1); empymod 2.6.0 for the comparison tests.
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools]
packages = ["terrasphere_csem", "terrasphere_csem.filters"]

[tool.setuptools.package-data]
"terrasphere_csem.filters" = ["*.txt"]
